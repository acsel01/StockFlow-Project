{% extends "base.html" %}

{% block title %}Inicio de sesión | StockFlow{% endblock %}

{% block content %}
<section class="sf-login-section">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card sf-login-card">
      <div class="card-body p-4 p-md-5">
        <div class="sf-login-mark"><span class="sf-monogram sf-monogram-sm" aria-hidden="true">SF</span> Acceso interno</div>
        <h1 class="h3 mb-2">Iniciar sesión</h1>
        <p class="text-secondary mb-4">Ingresá a la operación diaria de tu comercio.</p>

        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input
              class="form-control"
              id="email"
              name="email"
              type="email"
              value="{{ request.form.get('email', '') }}"
              autocomplete="username"
              required
              autofocus
            >
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <input
              class="form-control"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>
          <button class="btn btn-success w-100 py-2" type="submit">Iniciar sesión</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
